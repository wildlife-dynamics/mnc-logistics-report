id: logistics_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "1.0.0.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/


  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

rjsf-overrides:
  $defs:
    TimeFrequency.enum: ["Day", "Week", "Month", "Quarter", "Year"]
    TimeFrequency.default: "Month"

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
      
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []


  - name: Select Time Frequency
    id: time_frequency
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.select_time_frequency


  # One palette for every chart, so a category keeps the same color across the dashboard.
  # A custom list keeps these exact colors (named colormaps get resampled to the category count).
  - name: Set chart color palette
    id: category_color_palette
    task: ecoscope_workflows_ext_wwf_virunga.tasks.transformation.set_color_palette
    partial:
      color_palette:
        type_: custom
        colors:
          - "#1f77b4"
          - "#ff7f0e"
          - "#2ca02c"
          - "#d62728"
          - "#9467bd"
          - "#8c564b"
          - "#e377c2"
          - "#7f7f7f"
          - "#bcbd22"
          - "#17becf"
          - "#aec7e8"
          - "#ffbb78"
          - "#98df8a"
          - "#ff9896"
          - "#c5b0d5"
          - "#c49c94"
          - "#f7b6d2"
          - "#c7c7c7"
          - "#dbdb8d"
          - "#9edae5"

  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  # Get Logistic Events Only
  - name: Retrieve Logistic Events Only
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details
        - patrols
      event_types: [
        "balloon_landing",
        "airstrip_operations",
        "airstrip_maintenance",
        "airline_complaint"
        ]
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false
      force_point_geometry: true 

  # Extract date
  - name: Extract date from events data
    id: extract_event_date
    task: extract_column_as_type
    partial:
      df: ${{ workflow.get_events_data.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Add temporal index on events
    id: events_temporal
    task: add_temporal_index
    partial:
      df: ${{ workflow.extract_event_date.return }}
      time_col: date
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Filter events and get balloon sighting records 
    id: filter_balloon_events
    task: filter_df
    partial:
      column_name: event_type	
      op: equal
      value: balloon_landing
      df: ${{ workflow.events_temporal.return }}
      reset_index: false

  - name: Filter events and get airstrip operation records 
    id: filter_airstrip_operations
    task: filter_df
    partial:
      column_name: event_type	
      op: equal
      value: airstrip_operations
      df: ${{ workflow.events_temporal.return }}
      reset_index: false

  - name: Filter events and get airstrip maintenance records 
    id: filter_airstrip_maintenance
    task: filter_df
    partial:
      column_name: event_type	
      op: equal
      value: airstrip_maintenance
      df: ${{ workflow.events_temporal.return }}
      reset_index: false
  
  - name: Filter events and get airline complaint records 
    id: filter_airline_complaints
    task: filter_df
    partial:
      column_name: event_type	
      op: equal
      value: airline_complaint
      df: ${{ workflow.events_temporal.return }}
      reset_index: false

  - name: Process balloon event details 
    id: process_balloon_details
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_balloon_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true 

  - name: Normalize balloon event details values
    id: normalize_balloon_values
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_balloon_details.return }}
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop column prefix from balloon event details s
    id: drop_balloon_prefix 
    task: drop_column_prefix 
    partial:
      df: ${{ workflow.normalize_balloon_values.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"
  
  - name: Process airstrip operation event details 
    id: process_airstrip_details
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_airstrip_operations.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true
  
  - name: Normalize airstrip operation event details values
    id: normalize_airstrip_op_values
    task: normalize_json_column
    partial: 
      column: event_details
      df: ${{ workflow.process_airstrip_details.return }}
      skip_if_not_exists: true 
      sort_columns: true
    
  - name: Drop column prefix from airstrip operation event details 
    id: drop_airstrip_op_prefix 
    task: drop_column_prefix 
    partial:
      df: ${{ workflow.normalize_airstrip_op_values.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Process airstrip maintenance event details 
    id: process_airstrip_maint_details
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_airstrip_maintenance.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true
  
  - name: Normalize airstrip maintenance event details values
    id: normalize_airstrip_maint_vals
    task: normalize_json_column
    partial: 
      column: event_details
      df: ${{ workflow.process_airstrip_maint_details.return }}
      skip_if_not_exists: true 
      sort_columns: true
  
  - name: Drop column prefix from airstrip maintenance event details 
    id: drop_airstrip_maintenance_prefix 
    task: drop_column_prefix 
    partial:
      df: ${{ workflow.normalize_airstrip_maint_vals.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Process airline complaint event details 
    id: process_airline_comp_details
    task: process_events_details 
    partial: 
      df: ${{ workflow.filter_airline_complaints.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true
  
  - name: Normalize airline complaint event details values
    id: normalize_airline_comp_vals
    task: normalize_json_column
    partial: 
      column: event_details
      df: ${{ workflow.process_airline_comp_details.return }}
      skip_if_not_exists: true 
      sort_columns: true

  - name: Drop column prefix from airline complaint event details 
    id: drop_airline_complaint_prefix 
    task: drop_column_prefix 
    partial:
      df: ${{ workflow.normalize_airline_comp_vals.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Map balloon columns 
    id: map_balloon_columns 
    task: map_columns
    partial: 
      df: ${{ workflow.drop_balloon_prefix.return }}
      drop_columns: []
      retain_columns: [
        "date",
        "Balloon Company",
        "Where are clients staying?",
        "# of passengers"
      ]
      rename_columns: {
        "Balloon Company": "balloon_company",
        "Where are clients staying?": "where_are_clients_staying",
        "# of passengers":"no_of_passengers"
        }
      raise_if_not_found: false

  - name: Remove brackets from columns in balloon events
    id: remove_balloon_brackets
    task: ecoscope_workflows_ext_mnc.tasks.transformation.remove_brackets_from_column

    partial:
      df: ${{ workflow.map_balloon_columns.return }}
      columns:
        - balloon_company
        - where_are_clients_staying

  - name: Rename balloon landing table columns for display
    id: rename_balloon_display
    task: map_columns
    partial:
      df: ${{ workflow.remove_balloon_brackets.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "date": "Date",
        "balloon_company": "Balloon Company",
        "where_are_clients_staying": "Where Are Clients Staying",
        "no_of_passengers": "No Of Passengers"
        }
      raise_if_not_found: false


  - name: Assign colors to balloon companies
    id: balloon_company_colors
    task: ecoscope_workflows_ext_wwf_virunga.tasks.transformation.apply_cmap
    partial:
      df: ${{ workflow.remove_balloon_brackets.return }}
      input_column_name: balloon_company
      color_palette: ${{ workflow.category_color_palette.return }}
      output_column_name: balloon_company_colors
      color_format: "rgba_tuple"
      alpha: 1.0

  - name: Persist balloon landing summary table
    id: persist_balloon_landing
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.rename_balloon_display.return }}
      filename: balloon_landing_summary_table

  - name: Draw balloon landing summary table
    id: balloon_landing_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.rename_balloon_display.return }}
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Balloon Landing Summary"

  - name: Save balloon landing summary table (HTML)
    id: balloon_landing_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: balloon_landing_summary_table.html
      text: ${{ workflow.balloon_landing_table_html.return }}

  - name: Create balloon landing summary table widget
    id: balloon_landing_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Balloon Landing Summary"
      data: ${{ workflow.balloon_landing_table_html_url.return }}

  # map airstrip operations

  # balloon landing charts
  - name: Draw balloon passengers over time line chart
    id: balloon_pax_chart
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_grouped_line_time_series_chart
    partial:
      dataframe: ${{ workflow.balloon_company_colors.return }}
      x_axis: "date"
      y_axis: "no_of_passengers"
      group_column: "balloon_company"
      agg_function: "sum"
      time_frequency: ${{ workflow.time_frequency.return }}
      group_order: null
      fill: false 
      ascending: false 
      color_column: "balloon_company_colors"
      plot_style: null
      line_style: null 
      widget_id: null
      layout_style:
        font_size: 10
        plot_bgcolor: "#f5f5f5"
        font_color: null 
        font_style: null 
        showlegend: true
        legend_title: null
        title: null 
        title_x: 0.5 
        title_y: 0.95
        xaxis:
          title: "Date"
        yaxis:
          title: "Passengers"

  - name: Save balloon passengers over time chart (HTML)
    id: balloon_pax_chart_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: null
      filename_suffix: balloon_pax_chart
      text: ${{ workflow.balloon_pax_chart.return }}

  - name: Create balloon passengers over time chart widget
    id: balloon_pax_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Balloon Passengers Over Time"
      data: ${{ workflow.balloon_pax_chart_html_url.return }}

  - name: Draw balloon passengers by lodge bar chart
    id: balloon_lodge_chart
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      dataframe: ${{ workflow.balloon_company_colors.return }}
      category: "where_are_clients_staying"
      mode: stacked
      y_axis: "no_of_passengers"
      stack_column: "balloon_company"
      agg_function: "sum"
      ascending: true
      widget_id: null
      color_column: "balloon_company_colors"      
      plot_style:
        xperiodalignment: "middle"
      overlay_opacity: 0.6 
      category_order: null
      stack_order: null
      bar_chart_configs: null 
      layout_style:
        bargap: 0.05
        bargroupgap: 0.05
        title: null
        title_x: 0.01
        title_y: 0.95
        showlegend: true
        font_size: 10
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Where clients are staying"
        yaxis:
          title: "Passengers"

  - name: Save balloon passengers by lodge chart (HTML)
    id: balloon_lodge_chart_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: null
      filename_suffix: balloon_lodge_chart
      text: ${{ workflow.balloon_lodge_chart.return }}

  - name: Create balloon passengers by lodge chart widget
    id: balloon_lodge_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Balloon Passengers by Lodge"
      data: ${{ workflow.balloon_lodge_chart_html_url.return }}

  - name: Map airstrip operation columns 
    id: map_airstrip_op_columns 
    task: map_columns
    partial: 
      df: ${{ workflow.drop_airstrip_op_prefix.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "Airline":"airline",
        "Arrival or departure":"arrival_departure",
        "Attendant":"attendant",
        "Camp/Lodge":"camp_lodge",
        "Number of clients":"no_of_clients"
        }
      raise_if_not_found: false

  - name: Remove brackets from columns in airstrip operation events
    id: remove_airstrip_op_brackets
    task: ecoscope_workflows_ext_mnc.tasks.transformation.remove_brackets_from_column
    partial:
      df: ${{ workflow.map_airstrip_op_columns.return }}
      columns:
        - airline
        - arrival_departure
        - attendant
        - camp_lodge

  - name: Convert columns to integer 
    id: convert_airstrip_op_ints
    task: ecoscope_workflows_ext_mnc.tasks.transformation.convert_columns_to_int
    partial:
      df: ${{ workflow.remove_airstrip_op_brackets.return }} 
      columns:
        - no_of_clients
      errors: coerce
      fill_value: 0

  - name: Airstrip operation events summary table
    id: airstrip_op_summary_table 
    task: summarize_df 
    partial:
      df: ${{ workflow.convert_airstrip_op_ints.return }}
      groupby_cols:
        - camp_lodge
        - arrival_departure
      summary_params:
        - display_name: no_of_clients 
          aggregator: sum 
          column: no_of_clients
          decimal_places: 0 
      reset_index: true

  - name: Pivot airstrip operations summary table 
    id: pivot_airstrip_ops
    task: pivot_dataframe
    partial: 
      df: ${{ workflow.airstrip_op_summary_table.return }}
      index: camp_lodge
      columns: 
        - arrival_departure 
      values: 
        - no_of_clients
      fill_value: 0
  
  - name: Convert airstrip pivot table values to int
    id: convert_pivot_int
    task: ecoscope_workflows_ext_mnc.tasks.transformation.convert_columns_to_int
    partial:
      df: ${{ workflow.pivot_airstrip_ops.return }}
      columns: 
        - arrival
        - departure 
      errors: coerce 
      fill_value: 0 
      
  - name: Rename airstrip operations table columns for display
    id: rename_airstrip_op_display
    task: map_columns
    partial:
      df: ${{ workflow.convert_pivot_int.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "camp_lodge": "Camp Lodge",
        "no_of_clients_Arrival": "Arrival",
        "no_of_clients_Departure": "Departure"
        }
      raise_if_not_found: false


  # Arrival/Departure use the palette's first two colors. The grouped bar chart sets one hex color
  # per bar, so both airstrip charts use this fixed mapping to match each other.
  - name: Assign colors to arrivals and departures
    id: airstrip_direction_colors
    task: apply_color_map
    partial:
      df: ${{ workflow.convert_airstrip_op_ints.return }}
      input_column_name: arrival_departure
      output_column_name: arrival_departure_colors
      colormap:
        Arrival: "#1f77b4"
        Departure: "#ff7f0e"

  - name: Persist airstrip operations summary table
    id: persist_airstrip_operations
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.rename_airstrip_op_display.return }}
      filename: airstrip_operations_summary_table

  - name: Draw airstrip operations summary table
    id: airstrip_op_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.rename_airstrip_op_display.return }}
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Airstrip Operations Summary"

  - name: Save airstrip operations summary table (HTML)
    id: airstrip_op_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: airstrip_operations_summary_table.html
      text: ${{ workflow.airstrip_op_table_html.return }}

  - name: Create airstrip operations summary table widget
    id: airstrip_op_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Airstrip Operations Summary"
      data: ${{ workflow.airstrip_op_table_html_url.return }}


  # airstrip operations charts
  - name: Draw airstrip clients over time line chart
    id: airstrip_clients_chart
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_grouped_line_time_series_chart
    partial:
      dataframe: ${{ workflow.airstrip_direction_colors.return }}
      x_axis: "date"
      y_axis: "no_of_clients"
      group_column: "arrival_departure"
      agg_function: "sum"
      time_frequency: ${{ workflow.time_frequency.return }}
      group_order: null 
      fill: false
      ascending: false 
      color_column: "arrival_departure_colors"
      plot_style: null
      line_style: null 
      widget_id: null
      layout_style:
        font_size: 10
        plot_bgcolor: "#f5f5f5"
        font_color: null 
        font_style: null 
        showlegend: true
        legend_title: null
        title: null 
        title_x: 0.5 
        title_y: 0.95
        xaxis:
          title: "Date"
        yaxis:
          title: "Clients"

  - name: Save airstrip clients over time chart (HTML)
    id: airstrip_clients_chart_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: null
      filename_suffix: airstrip_clients_chart
      text: ${{ workflow.airstrip_clients_chart.return }}

  - name: Create airstrip clients over time chart widget
    id: airstrip_clients_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Airstrip Clients Over Time"
      data: ${{ workflow.airstrip_clients_chart_html_url.return }}

  - name: Draw airstrip clients by camp/lodge bar chart
    id: airstrip_lodge_chart
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      # grouped mode aggregates one column per bar, so it reads the wide table (one column per direction)
      dataframe: ${{ workflow.rename_airstrip_op_display.return }}
      category: "Camp Lodge"
      mode: grouped
      bar_chart_configs:
        - column: "Arrival"
          agg_func: "sum"
          label: "Arrival"
          show_label: false
          style:
            marker_color: "#1f77b4"
        - column: "Departure"
          agg_func: "sum"
          label: "Departure"
          show_label: false
          style:
            marker_color: "#ff7f0e"
      y_axis: null
      stack_column: null
      agg_function: null
      ascending: true
      widget_id: null
      color_column: null
      plot_style: null
      overlay_opacity: 0.6
      category_order: null
      stack_order: null
      layout_style:
        bargap: 0.05
        bargroupgap: 0.05
        title: null
        title_x: 0.01
        title_y: 0.95
        showlegend: true
        font_size: 10
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Camp/Lodge"
        yaxis:
          title: "Clients"

  - name: Save airstrip clients by camp/lodge chart (HTML)
    id: airstrip_lodge_chart_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: null
      filename_suffix: airstrip_lodge_chart
      text: ${{ workflow.airstrip_lodge_chart.return }}

  - name: Create airstrip clients by camp/lodge chart widget
    id: airstrip_lodge_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Airstrip Clients by Camp/Lodge"
      data: ${{ workflow.airstrip_lodge_chart_html_url.return }}

  - name: Map airstrip maintenace columns
    id: map_airstrip_maintenance
    task: map_columns 
    partial:
      df: ${{ workflow.drop_airstrip_maintenance_prefix.return }}
      drop_columns: []
      retain_columns: [
        "date",
        "Maintenance type"
      ]
      rename_columns: {
        "Maintenance type":"maintenance_type"
        }
      raise_if_not_found: false

  - name: Rename airstrip maintenance table columns for display
    id: rename_airstrip_maint_display
    task: map_columns
    partial:
      df: ${{ workflow.map_airstrip_maintenance.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "date": "Date",
        "maintenance_type": "Maintenance Type"
        }
      raise_if_not_found: false


  - name: Assign colors to maintenance types
    id: maintenance_type_colors
    task: ecoscope_workflows_ext_wwf_virunga.tasks.transformation.apply_cmap
    partial:
      df: ${{ workflow.map_airstrip_maintenance.return }}
      input_column_name: maintenance_type
      color_palette: ${{ workflow.category_color_palette.return }}
      output_column_name: maintenance_type_colors
      color_format: "rgba_tuple"
      alpha: 1.0

  - name: Persist airstrip maintenance summary table
    id: persist_airstrip_maintenance
    task: persist_df

    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.rename_airstrip_maint_display.return }}
      filename: airstrip_maintenance_summary_table

  - name: Draw airstrip maintenance summary table
    id: airstrip_maintenance_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.rename_airstrip_maint_display.return }}
      columns: null
      table_config:
